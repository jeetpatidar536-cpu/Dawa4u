<!DOCTYPE html>
<html lang="en" data-app="admin">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dawa4u Admin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12231c">
<link rel="icon" href="../common/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/style.css">
<style>
html,body{height:100%}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
aside{background:var(--card);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
aside .brand{margin:0 6px 14px}
aside a{padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
aside a.on{background:var(--leaf-soft);color:var(--leaf)}
aside .count{background:var(--sun);color:#fff;border-radius:999px;font-size:.72rem;padding:0 7px}
aside .foot{margin-top:auto;display:grid;gap:6px;font-size:.85rem}
.content{padding:24px;display:grid;gap:20px;align-content:start;max-width:1200px}
details.inline summary{cursor:pointer;color:var(--leaf);font-weight:600;font-size:.9rem;list-style:none}
details.inline summary::-webkit-details-marker{display:none}
details.inline[open]{background:var(--paper);border-radius:10px;padding:10px}
details.inline form{display:grid;gap:8px;margin-top:8px;min-width:220px}
.formgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));align-items:end}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:500;font-size:.9rem}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.hbar{display:grid;grid-template-columns:minmax(0,180px) 1fr auto;gap:10px;align-items:center;font-size:.9rem}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  aside{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line)}
  aside .brand{margin:0 8px 0 0}
  aside a{white-space:nowrap}
  aside .foot{margin:0 0 0 8px;display:flex}
  .content{padding:16px}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="../common/config.js"></script>
<script src="../common/ui.js"></script>
<script src="app.js"></script>
</body>
</html>
