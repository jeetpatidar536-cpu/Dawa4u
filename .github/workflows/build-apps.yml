# Builds the dawa4u apps and puts the files on the "app-builds" branch:
#   Android (customer, rider): release .aab for the Play Store (to be signed with the upload key, which is never in this repo)
#                              + a test .apk you can install straight on a phone
#   Windows (pharmacy):        installer .exe
name: Build dawa4u apps
on:
  workflow_dispatch:
  push:
    branches: [apps]

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, rider]
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Prepare the native project
        run: |
          npm ci
          npx cap sync android
      - name: Build .aab and .apk
        working-directory: mobile/${{ matrix.app }}/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleDebug
          mkdir -p $GITHUB_WORKSPACE/out
          V=$(grep -o 'versionName "[^"]*"' app/build.gradle | cut -d'"' -f2)
          cp app/build/outputs/bundle/release/app-release.aab $GITHUB_WORKSPACE/out/dawa4u-${{ matrix.app }}-$V-unsigned.aab
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/out/dawa4u-${{ matrix.app }}-$V-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.app }}
          path: out/*

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/pharmacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npx electron-builder --win nsis --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with: { name: windows-pharmacy, path: desktop/pharmacy/dist/*.exe }

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - name: Put the files on the app-builds branch
        run: |
          cd files
          # GitHub refuses files over 100 MB: split big ones into 90 MB parts (join with: cat name.part-* > name)
          for f in *; do if [ $(stat -c%s "$f") -gt 94000000 ]; then split -b 90m -d "$f" "$f.part-" && rm "$f"; fi; done
          {
            echo "# dawa4u app builds"
            echo
            echo "Built from commit ${GITHUB_SHA} on $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            for f in *; do [ "$f" = README.md ] || echo "- $f ($(du -h "$f" | cut -f1))"; done
          } > README.md
          git init -q -b app-builds
          git config user.name "dawa4u builds"
          git config user.email "builds@dawa4u.in"
          git add -A
          git commit -q -m "App builds for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" app-builds
