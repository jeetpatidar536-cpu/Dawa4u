# Builds the dawa4u native apps and puts the files on the "app-builds" branch:
#   Android (customer, rider, pharmacy): unsigned release .aab for the Play Store (sign it with your upload key)
#                                        + a debug-signed .apk to install directly for testing
#   Windows (pharmacy):                  installer .exe
name: Build dawa4u apps
on:
  workflow_dispatch:
  push:
    branches: [supabase-full-version]
    paths: ['dawa4u-supabase/mobile/**', 'dawa4u-supabase/desktop/**', '.github/workflows/build-apps.yml']

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, rider, pharmacy]
    defaults:
      run:
        working-directory: dawa4u-supabase/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Copy the web app into the native project
        run: |
          npm ci
          node build.mjs ${{ matrix.app }}
          cd ${{ matrix.app }}
          npm ci
          npx cap sync android
      - name: Build .aab and .apk
        working-directory: dawa4u-supabase/mobile/${{ matrix.app }}/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleDebug
          mkdir -p $GITHUB_WORKSPACE/out
          V=$(grep -o 'versionName "[^"]*"' app/build.gradle | cut -d'"' -f2)
          cp app/build/outputs/bundle/release/app-release.aab $GITHUB_WORKSPACE/out/dawa4u-${{ matrix.app }}-$V-unsigned.aab
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/out/dawa4u-${{ matrix.app }}-$V-test.apk
      - uses: actions/upload-artifact@v4
        with: { name: android-${{ matrix.app }}, path: out/* }

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dawa4u-supabase/desktop/pharmacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npx electron-builder --win nsis --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with: { name: windows-pharmacy, path: dawa4u-supabase/desktop/pharmacy/dist/*.exe }

  publish:
    needs: [android, windows]
    if: always()
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - name: Put the files on the app-builds branch
        run: |
          cd files
          ls -la
          {
            echo "# dawa4u app builds"
            echo
            echo "Built from commit ${GITHUB_SHA} on $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            for f in *; do [ "$f" = README.md ] || echo "- $f ($(du -h "$f" | cut -f1))"; done
          } > README.md
          git init -q -b app-builds
          git config user.name "dawa4u builds"
          git config user.email "builds@dawa4u.in"
          git add -A
          git commit -q -m "App builds for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" app-builds
