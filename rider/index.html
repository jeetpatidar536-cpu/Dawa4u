<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../common/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15370D">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>dawa4u Rider</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../common/icon-192.png">
<link rel="apple-touch-icon" href="../common/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/partner.css">
<style>
body{font-family:Inter,'Noto Sans Devanagari',system-ui,sans-serif;font-size:15px}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--ivory)}
.rtop{background:var(--em);padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.rmain{flex:1;padding-bottom:90px}
.rtabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px)}
.rtabs button{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);font-size:12px;font-weight:600;min-height:48px;justify-content:center}
.rtabs button.on{color:var(--em-text);font-weight:700}
.leg{display:flex;flex-direction:column;gap:4px;padding-left:14px;border-left:3px solid var(--gold)}
.leg.done{opacity:.5;border-left-color:var(--em-text)}
.btn.lg{height:56px;font-size:17px}
summary{cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<script src="../common/config.js"></script>
<script type="module" src="rider.js"></script>
</body>
</html>
