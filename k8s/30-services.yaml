apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: dawa4u }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: gateway
          image: ghcr.io/jeetpatidar536-cpu/dawa4u-services:latest
          args: ["uvicorn", "dawa4u_svc.gateway:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: d4u-config } }, { secretRef: { name: d4u-env } }]
          readinessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 30, failureThreshold: 4 }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: dawa4u }
spec: { selector: { app: gateway }, ports: [{ port: 8000 }] }
---
